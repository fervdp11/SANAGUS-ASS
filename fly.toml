# fly.toml app configuration file generated for pucela-us on 2026-10-18T01:18:57Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'pucela-us'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-4x'
